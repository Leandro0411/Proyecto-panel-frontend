<div class="min-h-screen bg-auth-grid bg-[linear-gradient(135deg,#06101f_0%,#1657c8_44%,#eef4ff_44%,#f8fbff_100%)] px-4 py-8">
  <div class="mx-auto grid min-h-[calc(100vh-4rem)] place-items-center">
    <mat-card class="app-surface w-full max-w-md rounded-[32px] border-0 p-6 sm:p-8">
      <div class="mb-8 text-center">
        <div class="mb-6 flex justify-center">
          <div class="flex items-center justify-center rounded-[24px] bg-brand-600 px-5 py-4 shadow-lg shadow-brand-600/25">
            <img src="assets/logo-esueldos.png" alt="e-Sueldos" class="h-10 w-auto object-contain" />
          </div>
        </div>

        <h2 class="m-0 text-3xl font-extrabold text-slate-900">Iniciar sesión</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-4">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-icon matSuffix>mail</mat-icon>
          <mat-error *ngIf="hasError('email', 'required')">El email es obligatorio.</mat-error>
          <mat-error *ngIf="hasError('email', 'email')">Ingresá un email válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error *ngIf="hasError('password', 'required')">El password es obligatorio.</mat-error>
          <mat-error *ngIf="hasError('password', 'minlength')">Mínimo 8 caracteres.</mat-error>
          <mat-error *ngIf="hasError('password', 'pattern')">Debe incluir letras y números.</mat-error>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="isSubmitting"
          class="!mt-3 !h-14 !w-full !rounded-2xl !bg-brand-600 !text-white"
        >
          <mat-spinner *ngIf="isSubmitting" diameter="18"></mat-spinner>
          <span *ngIf="!isSubmitting">Entrar al panel</span>
        </button>
      </form>

      <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-center text-sm text-slate-500">
        ¿Todavía no tenés cuenta?
        <a routerLink="/auth/register" class="font-bold text-brand-600 no-underline hover:text-brand-700">Creá un usuario</a>
      </div>
    </mat-card>
  </div>
</div>
