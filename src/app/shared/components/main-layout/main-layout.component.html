<div class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(22,93,255,.16),_transparent_25%),linear-gradient(180deg,#f7faff_0%,#eaf1ff_100%)]">
  <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
    <mat-toolbar class="app-surface sticky top-4 z-20 mb-6 flex !h-auto items-center gap-4 rounded-[28px] px-4 py-4 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center h-11 px-3 rounded-2xl bg-brand-600 shadow-lg shadow-brand-600/25">
          <img src="assets/logo-esueldos.png" alt="Logo" class="h-8 w-auto object-contain">
        </div>
        <div>
          <p class="m-0 text-xs font-bold uppercase tracking-[0.28em] text-slate-400">Panel Administrativo</p>
          <h1 class="m-0 text-lg font-extrabold text-slate-900 sm:text-xl">Proyecto Pasantías</h1>
        </div>
      </div>

      <span class="flex-1"></span>

      <ng-container *ngIf="user$ | async as user">
        <div class="hidden rounded-2xl border border-slate-200 bg-slate-50 px-4 py-2 text-right md:block">
          <p class="m-0 text-sm font-semibold text-slate-900">{{ user.name }}</p>
          <p class="m-0 text-xs uppercase tracking-[0.22em] text-slate-500">{{ user.role }}</p>
        </div>

        <button mat-flat-button type="button" color="primary" class="!rounded-2xl !px-4" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Salir
        </button>
      </ng-container>
    </mat-toolbar>

    <div class="grid gap-6 lg:grid-cols-[280px_minmax(0,1fr)]">
      <aside class="app-surface overflow-hidden rounded-[28px] p-4 sm:p-5">
        <mat-nav-list class="!p-0" *ngIf="user$ | async as user">
          <a
            *ngIf="user.role === 'admin'"
            mat-list-item
            routerLink="/users"
            routerLinkActive="bg-brand-600 text-white shadow-lg shadow-brand-600/20"
            class="mb-2 !rounded-2xl border border-slate-200 !px-4 !py-3 text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
          >
            <div class="flex items-center gap-3">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-600">
                <mat-icon>group</mat-icon>
              </span>
              <div>
                <span class="block text-sm font-bold">Usuarios</span>
                <span class="block text-xs text-slate-400">Control de cuentas</span>
              </div>
            </div>
          </a>

          <a
            mat-list-item
            routerLink="/products"
            routerLinkActive="bg-brand-600 text-white shadow-lg shadow-brand-600/20"
            class="mb-2 !rounded-2xl border border-slate-200 !px-4 !py-3 text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
          >
            <div class="flex items-center gap-3">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-600">
                <mat-icon>inventory_2</mat-icon>
              </span>
              <div>
                <span class="block text-sm font-bold">Productos</span>
                <span class="block text-xs text-slate-400">Catálogo</span>
              </div>
            </div>
          </a>

          <a
            mat-list-item
            routerLink="/profile"
            routerLinkActive="bg-brand-600 text-white shadow-lg shadow-brand-600/20"
            class="!rounded-2xl border border-slate-200 !px-4 !py-3 text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
          >
            <div class="flex items-center gap-3">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-600">
                <mat-icon>badge</mat-icon>
              </span>
              <div>
                <span class="block text-sm font-bold">Perfil</span>
                <span class="block text-xs text-slate-400">Datos y contraseña</span>
              </div>
            </div>
          </a>
        </mat-nav-list>
      </aside>

      <section class="min-w-0">
        <router-outlet></router-outlet>
      </section>
    </div>
  </div>
</div>
